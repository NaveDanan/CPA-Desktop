<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Usage and cost</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="dashboard-renderer.js" defer></script>
</head>
<body><main>
  <header class="section-head">
    <span class="eyebrow">Usage and cost</span>
    <h2>Spend by provider, model, and harness</h2>
    <p>Estimated at the per-model API prices GitHub publishes. GitHub Copilot can also be shown in AI credits ($1 = 100 credits).</p>
  </header>
  <div class="toolbar">
    <span id="window-label" class="window-label"></span>
    <div class="segmented" role="group" aria-label="Usage metric">
      <button type="button" data-metric="cost" aria-pressed="true">Cost</button>
      <button type="button" data-metric="tokens" aria-pressed="false">Tokens</button>
    </div>
    <div class="segmented" role="group" aria-label="Usage period">
      <button type="button" data-days="1" aria-pressed="false">Past 24h</button>
      <button type="button" data-days="7" aria-pressed="false">7 days</button>
      <button type="button" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" data-days="90" aria-pressed="false">90 days</button>
    </div>
    <button id="refresh" class="icon-button" type="button" aria-label="Refresh usage and prices" title="Refresh usage and prices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <section id="overview" class="overview" aria-label="All providers" hidden>
    <div class="headline">
      <div class="headline-figure"><span id="total-cost" class="big"></span><span class="label">Estimated cost, all providers</span></div>
      <div class="headline-figure"><span id="total-tokens" class="big"></span><span class="label">Tokens, all providers</span></div>
      <p id="total-note" class="figure-note"></p>
    </div>
    <div id="totals" class="metrics"></div>
  </section>
  <div id="providers"></div>
  <p id="pricing" class="note"></p>
</main></body></html>
